name: Build Flet APK and Website

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        id: build_apk
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-android-apk
          path: ${{ steps.build_apk.outputs.archive-path }}
          archive: false

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Website
        id: build_web
        uses: flet-dev/flet-build-action@v1
        with:
          target: web
      - name: Upload Website
        uses: actions/upload-artifact@v4
        with:
          name: my-website
          path: ${{ steps.build_web.outputs.archive-path }}
          archive: false
          
