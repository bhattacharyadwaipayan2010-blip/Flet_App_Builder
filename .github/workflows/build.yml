name: Build Flet APK and Website

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Android APK
        run: flet build apk --yes

      - name: Build Website
        run: flet build web --yes

      - name: Package Outputs
        uses: actions/upload-artifact@v4
        with:
          name: my-finished-app
          path: |
            build/apk/*.apk
            build/web/
            
